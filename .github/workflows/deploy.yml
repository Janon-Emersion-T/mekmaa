name: Deploy Mekmaa

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mekmaa-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mekmaa_dev
          POSTGRES_USER: mekmaa_dev
          POSTGRES_PASSWORD: mekmaa-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mekmaa_dev -d mekmaa_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /tmp/mekmaa .

      - name: Verify PostgreSQL connection
        env:
          MEKMAA_TEST_DATABASE_URL: postgres://mekmaa_dev:mekmaa-ci-password@127.0.0.1:5432/mekmaa_dev?sslmode=disable
        run: |
          go test \
            -run '^TestPostgresConnectionWhenConfigured$' \
            -count=1 \
            -v

      - name: Install PostgreSQL test tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common postgresql-client
          command -v pg_virtualenv

      - name: Verify PostgreSQL migrations
        run: |
          go test \
            -run '^(TestPostgresMigrationDiscoveryIncludesMCP|TestPostgresMigrationDiscoveryIncludesOneToOneAttendance|TestPostgresMigrationDiscoveryIncludesTournaments|TestPostgresMCPMigrationAppliesCleanly|TestPostgresMCPMigrationUpgradeFrom000005)$' \
            -count=1 \
            -timeout 120s \
            -v

      - name: Run full Go test suite
        run: |
          go test ./... \
            -count=1 \
            -timeout 120s

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Mekmaa
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -p "$VPS_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "sudo /usr/local/sbin/deploy-mekmaa"

      - name: Verify production readiness
        run: |
          STATUS="$(
            curl \
              --silent \
              --output /tmp/mekmaa-ready.json \
              --write-out '%{http_code}' \
              --max-time 20 \
              https://mekmaa.com/ready
          )"

          cat /tmp/mekmaa-ready.json || true

          if [ "$STATUS" != "200" ]; then
            echo "Production readiness returned HTTP $STATUS"
            exit 1
          fi

          echo "Mekmaa production readiness passed."
