{{define "receipt-print-styles"}}
<style>
  .receipt-print-page {
    width: 100%;
    max-width: none;
  }

  .receipt-print-shell {
    width: 79.5mm;
    max-width: 79.5mm;
    margin-left: auto;
    margin-right: auto;
  }

  .receipt-printable {
    width: 100%;
    max-width: 100%;
  }

  .receipt-divider {
    border-top: 1px dashed #0f172a;
  }

  .receipt-brand-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    align-items: center;
    gap: 0.4rem;
  }

  .receipt-brand-logo {
    width: 100%;
    height: 2.75rem;
    object-fit: contain;
    object-position: center;
  }

  .receipt-inline-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: 0.45rem;
    row-gap: 0.1rem;
  }

  .receipt-inline-row dt {
    flex: 0 0 auto;
  }

  .receipt-inline-row dd {
    min-width: 0;
    overflow-wrap: anywhere;
  }

  @media print {
    @page {
      size: 80mm auto;
      margin: 0;
    }

    html,
    body {
      width: 80mm !important;
      min-width: 80mm !important;
      height: auto !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #ffffff !important;
    }

    body {
      overflow: visible !important;
    }

    body * {
      visibility: hidden !important;
    }

    .hide-chrome-shell {
      display: block !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .receipt-print-page,
    .receipt-print-page * {
      visibility: visible !important;
    }

    .receipt-print-page {
      display: block !important;
      width: 80mm !important;
      min-width: 80mm !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #ffffff !important;
    }

    .receipt-print-shell {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 80mm !important;
      max-width: 80mm !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #ffffff !important;
    }

    .receipt-printable {
      width: 77mm !important;
      max-width: 77mm !important;
      margin: 0 auto !important;
      padding: 3mm 1mm 5mm !important;
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      background: #ffffff !important;
      color: #000000 !important;
      break-inside: avoid;
      page-break-inside: avoid;
      overflow: visible !important;
    }

    .receipt-printable,
    .receipt-printable * {
      color: #000000 !important;
      box-shadow: none !important;
      text-shadow: none !important;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }

    .receipt-logo {
      filter: grayscale(1) contrast(1.2);
    }

    .receipt-brand-logo {
      filter: grayscale(1) contrast(1.2);
    }

    .receipt-divider {
      border-top-color: #000000 !important;
    }

    .no-print {
      display: none !important;
    }
  }
</style>
{{end}}
