{{define "staff-navigation"}}
<nav aria-label="Staff workspace" class="mb-6 flex flex-wrap gap-2 rounded-2xl border border-slate/10 bg-white p-3 text-sm font-semibold">
  {{if hasPermission .User "coaches.view"}}
  <a href="{{scopedURL "/admin/staff" .SelectedDivision .SelectedDivisionScope}}" class="rounded-xl px-3 py-2 hover:bg-cloud">Staff directory</a>
  <a href="{{scopedURL "/admin/staff/attendance" .SelectedDivision .SelectedDivisionScope}}" class="rounded-xl px-3 py-2 hover:bg-cloud">Attendance</a>
  <a href="{{scopedURL "/admin/staff/attendance/report" .SelectedDivision .SelectedDivisionScope}}" class="rounded-xl px-3 py-2 hover:bg-cloud">Attendance report</a>
  {{end}}
  {{if hasPermission .User "payroll.view"}}
  <a href="/admin/staff/salary-payments" class="rounded-xl px-3 py-2 hover:bg-cloud">Salary payments</a>
  <a href="/admin/staff/salary-profiles" class="rounded-xl px-3 py-2 hover:bg-cloud">Salary profiles</a>
  <a href="/admin/staff/advances" class="rounded-xl px-3 py-2 hover:bg-cloud">Advances</a>
  {{end}}
</nav>
<script>
document.querySelectorAll('nav[aria-label="Staff workspace"] a').forEach(link => {
  if (new URL(link.href).pathname === window.location.pathname) {
    link.setAttribute("aria-current", "page");
    link.classList.add("bg-cloud", "text-obsidian");
  }
});
</script>
{{end}}
