{{define "customer-mcp-new"}}{{template "base" .}}{{end}}

{{define "content"}}
<section class="mx-auto max-w-4xl rounded-[2rem] border border-white/80 bg-white/90 p-6 shadow-float sm:p-8">
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="text-xs font-bold uppercase tracking-[0.22em] text-slate/45">New MCP</p>
      <h1 class="mt-2 text-3xl font-semibold text-obsidian">Create Monthly Court Plan</h1>
    </div>
    <a href="/customer/mcp" class="rounded-xl bg-cloud px-4 py-2 text-sm font-semibold text-slate">Back</a>
  </div>

  <form action="/customer/mcp/new" method="post" class="mt-8 grid gap-4 md:grid-cols-2">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label><span class="mb-2 block text-sm font-semibold text-slate/65">Month</span><input type="month" name="plan_month" value="{{.MCPSelectedMonth}}" required class="h-12 w-full rounded-2xl border border-slate/10 bg-white px-4 text-sm"></label>
    <label><span class="mb-2 block text-sm font-semibold text-slate/65">Title</span><input type="text" name="title" required placeholder="September Badminton Plan" class="h-12 w-full rounded-2xl border border-slate/10 bg-white px-4 text-sm"></label>
    <label><span class="mb-2 block text-sm font-semibold text-slate/65">Activity</span><select name="activity" class="h-12 w-full rounded-2xl border border-slate/10 bg-white px-4 text-sm">{{range .BookingOptions}}<option value="{{.Activity}}">{{.Label}}</option>{{end}}</select></label>
    <label><span class="mb-2 block text-sm font-semibold text-slate/65">Quantity</span><input type="number" name="quantity" min="1" value="1" required class="h-12 w-full rounded-2xl border border-slate/10 bg-white px-4 text-sm"></label>
    <div class="md:col-span-2 rounded-[1.5rem] border border-slate/10 bg-cloud/35 p-4">
      <p class="text-sm font-semibold text-obsidian">Recurring rules</p>
      <p class="mt-1 text-xs text-slate/55">Each rule creates one-hour sessions within the selected month.</p>
      <div class="mt-4 grid gap-3 md:grid-cols-3">
        <select name="weekday" class="h-11 rounded-xl border border-slate/10 bg-white px-3 text-sm"><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option><option value="0">Sunday</option></select>
        <input type="time" name="start_hour" value="08:00" class="h-11 rounded-xl border border-slate/10 bg-white px-3 text-sm">
        <input type="time" name="end_hour" value="10:00" class="h-11 rounded-xl border border-slate/10 bg-white px-3 text-sm">
      </div>
      <div class="mt-3 grid gap-3 md:grid-cols-3">
        <select name="weekday" class="h-11 rounded-xl border border-slate/10 bg-white px-3 text-sm"><option value="3">Wednesday</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option><option value="0">Sunday</option></select>
        <input type="time" name="start_hour" value="14:00" class="h-11 rounded-xl border border-slate/10 bg-white px-3 text-sm">
        <input type="time" name="end_hour" value="15:00" class="h-11 rounded-xl border border-slate/10 bg-white px-3 text-sm">
      </div>
    </div>
    <label class="md:col-span-2"><span class="mb-2 block text-sm font-semibold text-slate/65">Notes</span><textarea name="notes" rows="3" class="w-full rounded-2xl border border-slate/10 bg-white px-4 py-3 text-sm" placeholder="Optional customer note"></textarea></label>
    <div class="md:col-span-2 flex justify-end"><button class="h-12 rounded-2xl bg-obsidian px-6 text-sm font-semibold text-cloud">Submit plan request</button></div>
  </form>
</section>
{{end}}
